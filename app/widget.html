<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Profile</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="css/index.css">
  </head>
  <body>
    <div class="card" id="card">
      <div class="card__bar"></div>
      <div id="screen-main" class="screen">

        <header class="head">
          <div class="head__row">
            <div id="hero" class="hero hidden">
              <span class="hero__dot"></span>
              <span id="titleText" class="hero__type"></span>
            </div>
            <div class="head__actions">
              <button type="button" class="sq-btn js-min" aria-label="Minimize" title="Minimize">
                <svg class="ico-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <svg class="ico-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
              </button>
              <button type="button" class="sq-btn js-close" aria-label="Close" title="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          </div>
          <div id="meta" class="head__meta hidden">
            <span id="contactWrap" class="juris">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span id="contactName"></span>
            </span>
            <span id="rvBadge" class="rv hidden"></span>
            <div id="countBadge" class="hidden"></div>
          </div>
        </header>

        <div id="loader" class="state" aria-live="polite">
          <div class="spinner"></div>
          <p>Loading contact profile…</p>
        </div>

        <main id="main-view" class="body body--tabs hidden">
          <nav class="tabs" id="tabs" role="tablist" aria-label="Contact sections">
            <button type="button" class="tab is-active" role="tab" data-tab="general" aria-selected="true">General</button>
            <button type="button" class="tab" role="tab" data-tab="passport" aria-selected="false">Passport<i class="tab__dot hidden" id="dot-passport"></i></button>
            <button type="button" class="tab hidden" id="tab-eid" role="tab" data-tab="eid" aria-selected="false">Emirates ID<i class="tab__dot hidden" id="dot-eid"></i></button>
            <button type="button" class="tab" role="tab" data-tab="roles" aria-selected="false">Companies<span class="tab__n" id="tabCount">0</span></button>
          </nav>

          <section class="pane pane--general" id="pane-general" role="tabpanel"></section>
          <section class="pane pane--passport hidden" id="pane-passport" role="tabpanel"></section>
          <section class="pane pane--eid hidden" id="pane-eid" role="tabpanel"></section>

          <section class="pane pane--roles hidden" id="pane-roles" role="tabpanel">
            <div class="co-bar">
              <label class="co-filter hidden" id="filterWrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input type="text" id="coFilter" placeholder="Filter companies…" autocomplete="off" aria-label="Filter companies">
              </label>
              <button type="button" id="addRow" class="btn btn--primary hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
                Add company
              </button>
            </div>
            <div id="rows" class="rows"></div>
            <div id="empty" class="empty hidden">
              <strong id="emptyTitle">No companies yet</strong>
              <span id="emptyText"></span>
            </div>
            <div id="more" class="more hidden"><button type="button" id="moreBtn" class="more__btn"></button></div>
          </section>
        </main>

        <main id="error-view" class="body hidden" aria-live="polite">
          <div class="banner banner--urgent">
            <span class="banner__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.8 19a1.5 1.5 0 0 0 1.3 2.2h15.8a1.5 1.5 0 0 0 1.3-2.2L12 3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span>
            <div class="banner__text">
              <strong id="error-title">Couldn't load profile</strong>
              <span id="error-message">Something went wrong while loading this contact's data.</span>
            </div>
          </div>
          <section class="group">
            <div class="group__head">
              <span class="group__title">Technical Details</span>
              <button type="button" id="copyBtn" class="link-btn">Copy</button>
            </div>
            <pre id="debug" class="debug"></pre>
          </section>
        </main>
      </div>

      <!-- Add / edit company window -->
      <div id="modal" class="modal hidden">
        <div id="dialog" class="dialog" role="dialog" aria-modal="true"></div>
      </div>

      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </div>

    <script src="js/tabs.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
